name: 테스트

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 문법 검사
        run: |
          for f in $(find assets/js tools -name '*.mjs' -o -name '*.js'); do
            node --check "$f" || exit 1
          done
      - name: 로직 테스트
        run: node tools/test.mjs
      - name: 크롤러 dry-run
        run: node tools/crawl.mjs --dry
